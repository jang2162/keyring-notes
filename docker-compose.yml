# Keyring Notes
#
#   docker compose up -d                      # http://127.0.0.1:8787 (이 컴퓨터에서만)
#
# 처음 실행하면 로그에 설정 코드가 나온다: docker compose logs keyring
# 설정은 .env 파일에 둔다(.env.example 참고).
# 웹 서버(리버스 프록시)는 이 저장소가 제공하지 않는다. 서버용 설정은 compose.override.yaml 에 쓴다(docs/guides/deploy-docker.md).
# 서버에서 빌드할 때는 docker/compose.build.yaml 을 이 파일 뒤에 건다.
# 함께 든 MinIO 를 S3 로 쓰려면 .env 에 COMPOSE_PROFILES=s3 (쓰던 S3 를 쓰면 켜지 않는다).
services:
  keyring:
    image: ${KEYRING_IMAGE:-ghcr.io/jang2162/keyring-notes}:${KEYRING_TAG:-latest}
    build: .
    restart: unless-stopped
    init: true
    ports:
      # 인터넷에 직접 열지 않는다. 원격 접속은 HTTPS 리버스 프록시나 VPN(Tailscale) 뒤에서.
      - "${KEYRING_BIND:-127.0.0.1}:${KEYRING_PORT:-8787}:8787"
    environment:
      KEYRING_PUBLIC_URL: ${KEYRING_PUBLIC_URL:-}
      KEYRING_ALLOWED_HOSTS: ${KEYRING_ALLOWED_HOSTS:-}
      KEYRING_FETCH_ALLOW_PRIVATE: ${KEYRING_FETCH_ALLOW_PRIVATE:-0}
      KEYRING_S3_BUCKET: ${KEYRING_S3_BUCKET:-}
      KEYRING_S3_ACCESS_KEY_ID: ${KEYRING_S3_ACCESS_KEY_ID:-}
      KEYRING_S3_SECRET_ACCESS_KEY: ${KEYRING_S3_SECRET_ACCESS_KEY:-}
      KEYRING_S3_REGION: ${KEYRING_S3_REGION:-}
      KEYRING_S3_ENDPOINT: ${KEYRING_S3_ENDPOINT:-}
      KEYRING_S3_PREFIX: ${KEYRING_S3_PREFIX:-}
      KEYRING_S3_PATH_STYLE: ${KEYRING_S3_PATH_STYLE:-}
      KEYRING_S3_BLOBS: ${KEYRING_S3_BLOBS:-0}
      KEYRING_S3_BLOB_MIN_KB: ${KEYRING_S3_BLOB_MIN_KB:-}
      KEYRING_S3_ENCRYPTION_KEY: ${KEYRING_S3_ENCRYPTION_KEY:-}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      # 기본은 named volume. 서버에서는 KEYRING_DATA_DIR 에 호스트 경로를 주면 그 디렉터리에 둔다
      - ${KEYRING_DATA_DIR:-keyring-data}:/data

  # S3 를 직접 구성할 때만 뜬다(COMPOSE_PROFILES=s3). keyring 이 읽는 KEYRING_S3_ACCESS_KEY_ID·SECRET_ACCESS_KEY·BUCKET 을 그대로 쓴다.
  # 꺼진 프로필에서도 변수 치환은 평가되므로 :? 를 쓸 수 없다. 비었을 때 MinIO 가 기본 계정(minioadmin)으로 뜨지 않게 시작 전에 직접 검사한다.
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio}
    profiles: ["s3"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${KEYRING_S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${KEYRING_S3_SECRET_ACCESS_KEY:-}
    entrypoint: >
      /bin/sh -c 'if [ -z "$$MINIO_ROOT_USER" ] || [ "$${#MINIO_ROOT_PASSWORD}" -lt 8 ]; then
      echo "COMPOSE_PROFILES=s3 needs KEYRING_S3_ACCESS_KEY_ID and a KEYRING_S3_SECRET_ACCESS_KEY of 8+ characters" >&2; exit 1; fi;
      exec minio server /data'
    volumes:
      - ${MINIO_DATA_DIR:-minio-data}:/data

  # 버킷이 없으면 만들고 끝난다. MinIO 가 뜰 때까지 재시도한다
  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc}
    profiles: ["s3"]
    restart: "no"
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${KEYRING_S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${KEYRING_S3_SECRET_ACCESS_KEY:-}
      BUCKET: ${KEYRING_S3_BUCKET:-}
    entrypoint: >
      /bin/sh -c 'if [ -z "$$BUCKET" ]; then echo "COMPOSE_PROFILES=s3 needs KEYRING_S3_BUCKET" >&2; exit 1; fi;
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done;
      mc mb --ignore-existing "local/$$BUCKET"'

volumes:
  keyring-data:
  minio-data:
