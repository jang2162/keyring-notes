# Keyring Notes
#
#   docker compose up -d                      # http://127.0.0.1:8787 (이 컴퓨터에서만)
#
# 처음 실행하면 로그에 설정 코드가 나온다: docker compose logs keyring
# 설정은 .env 파일에 둔다(.env.example 참고).
# 웹 서버(리버스 프록시)는 이 저장소가 제공하지 않는다. 서버용 설정은 compose.override.yaml 에 쓴다(docs/guides/deploy-docker.md).
# 이미지는 레지스트리에서 받지 않고 이 저장소 코드로 빌드한다(up 할 때마다).
# 함께 든 SeaweedFS 를 S3 로 쓰려면 .env 에 COMPOSE_PROFILES=s3 (쓰던 S3 를 쓰면 켜지 않는다).
services:
  keyring:
    image: keyring-notes:local
    build: .
    # 레지스트리에 없는 이미지다: pull 을 건너뛰고 up 할 때마다 저장소 코드로 빌드한다
    pull_policy: build
    restart: unless-stopped
    init: true
    ports:
      # 인터넷에 직접 열지 않는다. 원격 접속은 HTTPS 리버스 프록시나 VPN(Tailscale) 뒤에서.
      - "${KEYRING_BIND:-127.0.0.1}:${KEYRING_PORT:-8787}:8787"
    environment:
      KEYRING_PUBLIC_URL: ${KEYRING_PUBLIC_URL:-}
      KEYRING_ALLOWED_HOSTS: ${KEYRING_ALLOWED_HOSTS:-}
      KEYRING_FETCH_ALLOW_PRIVATE: ${KEYRING_FETCH_ALLOW_PRIVATE:-0}
      KEYRING_S3_BUCKET: ${KEYRING_S3_BUCKET:-}
      KEYRING_S3_ACCESS_KEY_ID: ${KEYRING_S3_ACCESS_KEY_ID:-}
      KEYRING_S3_SECRET_ACCESS_KEY: ${KEYRING_S3_SECRET_ACCESS_KEY:-}
      KEYRING_S3_REGION: ${KEYRING_S3_REGION:-}
      KEYRING_S3_ENDPOINT: ${KEYRING_S3_ENDPOINT:-}
      KEYRING_S3_PREFIX: ${KEYRING_S3_PREFIX:-}
      KEYRING_S3_PATH_STYLE: ${KEYRING_S3_PATH_STYLE:-}
      KEYRING_S3_BLOBS: ${KEYRING_S3_BLOBS:-0}
      KEYRING_S3_BLOB_MIN_KB: ${KEYRING_S3_BLOB_MIN_KB:-}
      KEYRING_S3_ENCRYPTION_KEY: ${KEYRING_S3_ENCRYPTION_KEY:-}
      # 컨테이너 안 경로다. 키 파일은 /data 아래에 둔다(예: /data/s3.key)
      KEYRING_S3_ENCRYPTION_KEY_FILE: ${KEYRING_S3_ENCRYPTION_KEY_FILE:-}
      KEYRING_EMBED_URL: ${KEYRING_EMBED_URL:-}
      KEYRING_EMBED_MODEL: ${KEYRING_EMBED_MODEL:-}
      KEYRING_EMBED_KEY: ${KEYRING_EMBED_KEY:-}
      KEYRING_SCHEDULER: ${KEYRING_SCHEDULER:-}
      KEYRING_BACKUP_SCHEDULER: ${KEYRING_BACKUP_SCHEDULER:-}
      # 값 없이 적은 둘은 .env 에 없으면 컨테이너에 넘기지 않는다. 서버가 빈 값을 「없음」과 다르게 읽기 때문이다:
      # KEYRING_UPDATE_URL 은 빈 값이면 업데이트 확인을 끄고, KEYRING_LANG 은 빈 값이면 LANG 으로 넘어가지 않는다
      KEYRING_UPDATE_URL:
      KEYRING_LANG:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      # 기본은 named volume. 서버에서는 KEYRING_DATA_DIR 에 호스트 경로를 주면 그 디렉터리에 둔다
      - ${KEYRING_DATA_DIR:-keyring-data}:/data

  # S3 를 직접 구성할 때만 뜬다(COMPOSE_PROFILES=s3). SeaweedFS 의 weed mini 가 S3 게이트웨이(8333)를 열고 버킷도 만든다.
  # keyring 이 읽는 KEYRING_S3_ACCESS_KEY_ID·SECRET_ACCESS_KEY·BUCKET 을 그대로 쓴다.
  # 키가 비면 SeaweedFS 는 인증 없이 모두 허용하는 모드로 뜬다. 꺼진 프로필에서도 :? 가 평가되므로 쓰지 않고, 시작 전에 직접 검사한다.
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs}
    profiles: ["s3"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${KEYRING_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${KEYRING_S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${KEYRING_S3_BUCKET:-}
    entrypoint: >
      /bin/sh -c 'if [ -z "$$AWS_ACCESS_KEY_ID" ] || [ -z "$$AWS_SECRET_ACCESS_KEY" ] || [ -z "$$S3_BUCKET" ]; then
      echo "COMPOSE_PROFILES=s3 needs KEYRING_S3_ACCESS_KEY_ID, KEYRING_S3_SECRET_ACCESS_KEY and KEYRING_S3_BUCKET" >&2; exit 1; fi;
      exec weed mini -dir=/data'
    volumes:
      - ${SEAWEEDFS_DATA_DIR:-seaweedfs-data}:/data

volumes:
  keyring-data:
  seaweedfs-data:
