# Keyring Notes
#
#   docker compose up -d                      # http://127.0.0.1:8787 (이 컴퓨터에서만)
#   docker compose --profile https up -d      # Caddy가 KEYRING_DOMAIN으로 HTTPS 인증서를 받아 앞에 선다
#
# 처음 실행하면 로그에 설정 코드가 나온다: docker compose logs keyring
# 설정은 .env 파일에 둔다(.env.example 참고).
# 프록시 뒤에 두거나 서버에서 빌드할 때는 docker/compose.*.yaml 을 이 파일 뒤에 건다(Komodo 배포: docs/guides/deploy-komodo.md).
services:
  keyring:
    image: ${KEYRING_IMAGE:-ghcr.io/jang2162/keyring-notes}:${KEYRING_TAG:-latest}
    build: .
    restart: unless-stopped
    init: true
    ports:
      # 인터넷에 직접 열지 않는다. 원격 접속은 https 프로필(Caddy)이나 VPN(Tailscale)으로.
      - "${KEYRING_BIND:-127.0.0.1}:${KEYRING_PORT:-8787}:8787"
    environment:
      KEYRING_PUBLIC_URL: ${KEYRING_PUBLIC_URL:-}
      KEYRING_ALLOWED_HOSTS: ${KEYRING_ALLOWED_HOSTS:-}
      KEYRING_FETCH_ALLOW_PRIVATE: ${KEYRING_FETCH_ALLOW_PRIVATE:-0}
      KEYRING_S3_BUCKET: ${KEYRING_S3_BUCKET:-}
      KEYRING_S3_ACCESS_KEY_ID: ${KEYRING_S3_ACCESS_KEY_ID:-}
      KEYRING_S3_SECRET_ACCESS_KEY: ${KEYRING_S3_SECRET_ACCESS_KEY:-}
      KEYRING_S3_REGION: ${KEYRING_S3_REGION:-}
      KEYRING_S3_ENDPOINT: ${KEYRING_S3_ENDPOINT:-}
      KEYRING_S3_PREFIX: ${KEYRING_S3_PREFIX:-}
      KEYRING_S3_PATH_STYLE: ${KEYRING_S3_PATH_STYLE:-}
      KEYRING_S3_BLOBS: ${KEYRING_S3_BLOBS:-0}
      KEYRING_S3_BLOB_MIN_KB: ${KEYRING_S3_BLOB_MIN_KB:-}
      KEYRING_S3_ENCRYPTION_KEY: ${KEYRING_S3_ENCRYPTION_KEY:-}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      # 기본은 named volume. 서버에서는 KEYRING_DATA_DIR 에 호스트 경로를 주면 그 디렉터리에 둔다
      - ${KEYRING_DATA_DIR:-keyring-data}:/data

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [keyring]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KEYRING_DOMAIN: ${KEYRING_DOMAIN:?https 프로필에는 KEYRING_DOMAIN이 필요합니다}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  keyring-data:
  caddy-data:
  caddy-config:
