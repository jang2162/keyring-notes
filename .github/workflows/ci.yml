# 검사: 포맷·린트·타입체크·테스트·빌드. main 으로의 push 와 pull request 에서 돈다.
# 로컬에서 같은 것을 돌리는 법은 docs/guides/development.md 「검사」.
#
# Node 는 두 벌로 돈다 — 개발 런타임(mise.toml 의 24)과 운영 런타임(Dockerfile 의 node:22). package.json 의 engines 는 >=22.13 이다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 같은 ref 에 새 커밋이 오면 앞선 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      # mise.toml 의 node 판을 이 값으로 덮는다(mise 의 MISE_<도구>_VERSION). pnpm 판은 mise.toml 을 그대로 따른다
      MISE_NODE_VERSION: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      # node·pnpm 은 mise 로 올린다(release-macos.yml 과 같은 방식).
      # 기본 캐시 키에는 환경 변수가 들지 않으므로 Node 판마다 캐시를 가른다
      - uses: jdx/mise-action@v5
        with:
          cache_key_prefix: mise-v1-node${{ matrix.node }}

      # 덮어쓰기가 먹지 않으면 두 벌이 조용히 같은 Node 로 돈다 — 그 경우 여기서 멈춘다
      - name: 런타임 확인
        run: |
          echo "node $(node -v), pnpm $(pnpm -v)"
          case "$(node -v)" in
            "v$MISE_NODE_VERSION".*) ;;
            *) echo "::error::node $(node -v) 가 $MISE_NODE_VERSION 이 아니다"; exit 1 ;;
          esac

      - run: pnpm install --frozen-lockfile

      - run: pnpm fmt:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
