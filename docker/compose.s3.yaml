# S3 를 직접 구성할 때 docker-compose.yml 뒤에 건다: 함께 든 MinIO 를 S3 로 쓴다. 쓰던 S3 가 있으면 이 파일 없이 KEYRING_S3_* 만 채운다.
#   docker compose -f docker-compose.yml -f docker/compose.s3.yaml up -d
# keyring 이 읽는 KEYRING_S3_ACCESS_KEY_ID·SECRET_ACCESS_KEY·BUCKET 을 그대로 쓰므로 키를 두 번 적지 않는다.
# 쓰는 법: docs/guides/deploy-docker.md
services:
  # keyring 이 읽는 KEYRING_S3_ACCESS_KEY_ID·SECRET_ACCESS_KEY·BUCKET 을 그대로 쓰므로 키를 두 번 적지 않는다.
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio}
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${KEYRING_S3_ACCESS_KEY_ID:?compose.s3.yaml 에는 KEYRING_S3_ACCESS_KEY_ID 가 필요합니다}
      MINIO_ROOT_PASSWORD: ${KEYRING_S3_SECRET_ACCESS_KEY:?compose.s3.yaml 에는 KEYRING_S3_SECRET_ACCESS_KEY(8자 이상)가 필요합니다}
    volumes:
      - ${MINIO_DATA_DIR:-minio-data}:/data

  # 버킷이 없으면 만들고 끝난다. MinIO 가 뜰 때까지 재시도한다
  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc}
    restart: "no"
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${KEYRING_S3_ACCESS_KEY_ID:?}
      MINIO_ROOT_PASSWORD: ${KEYRING_S3_SECRET_ACCESS_KEY:?}
      BUCKET: ${KEYRING_S3_BUCKET:?compose.s3.yaml 에는 KEYRING_S3_BUCKET 이 필요합니다}
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/$$BUCKET"

volumes:
  minio-data:
