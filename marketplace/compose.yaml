# Keyring Notes 마켓 서버(정적 저장소). 앱의 docker-compose.yml 과 따로 띄운다.
#
#   docker compose -f marketplace/compose.yaml up -d --build      # http://127.0.0.1:8080/index.json (이 컴퓨터에서만)
#
# 설정은 marketplace/.env(marketplace/.env.example 참고). 리버스 프록시·TLS 는 이 저장소가 제공하지 않는다 —
# 앱은 https 저장소만 받으므로 운영자가 서버의 marketplace/compose.override.yaml 로 프록시 네트워크에 붙인다.
# 개인 마켓은 같은 override 에서 자기 패키지 폴더를 /srv/market/packages 에 마운트한다.
# 규칙: docs/guides/deploy-docker.md, 공식 마켓 배포: docs/guides/deploy-marketplace.md
services:
  market:
    image: keyring-notes-market:local
    build:
      context: ..
      dockerfile: marketplace/Dockerfile
    # 레지스트리에 없는 이미지다: pull 을 건너뛰고 up 할 때마다 저장소 코드로 빌드한다
    pull_policy: build
    restart: unless-stopped
    init: true
    ports:
      - "${MARKET_BIND:-127.0.0.1}:${MARKET_PORT:-8080}:8080"
    environment:
      MARKET_REBUILD_SECONDS: ${MARKET_REBUILD_SECONDS:-60}
      MARKET_NAME: ${MARKET_NAME:-Keyring Notes}
