# Orca 워크트리 설정. 규칙은 docs/guideline/orca/06-orca-yaml.md.
# 로컬 데이터(config/, vault/, backups/, .env)는 복사하지 않는다 — 워크트리는 임시 KEYRING_DATA 로 띄운다.
scripts:
  setup: |
    set -e
    mise trust
    mise install
    mise exec -- pnpm install --frozen-lockfile
    # 에이전트 지침 생성물(CLAUDE.md·AGENTS.md·.claude/ 등)은 gitignore 라 워크트리에 따라오지 않는다 — 여기서 만든다
    mise exec -- pnpm exec ruler apply
    # 워크트리마다 자기 codegraph 인덱스(루트 인덱스는 루트 코드로 답한다). 실패해도 셋업은 멈추지 않는다
    npx -y @colbymchenry/codegraph init || echo "codegraph init 실패: 인덱스 없이 진행"
setupAgentStartupPolicy: wait-for-setup
