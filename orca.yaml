# Orca 워크트리 설정. 규칙은 docs/guideline/base/orca/06-orca-yaml.md.
# 로컬 데이터(config/, vault/, backups/, .env)는 복사하지 않는다 — 워크트리는 임시 KEYRING_DATA 로 띄운다.
scripts:
  setup: |
    set -e
    mise trust
    mise install
    # 에이전트 지침 생성물(AGENTS.md·.claude/ 등)은 gitignore 라 워크트리에 따라오지 않는다 — pnpm install 의 prepare(guideline apply)가 만든다
    mise exec -- pnpm install --frozen-lockfile
setupAgentStartupPolicy: wait-for-setup
