# Ruler 설정. 지침 소스는 .ruler/, AGENTS.md·CLAUDE.md 등은 생성물이다(ruler apply).
default_agents = ["claude", "codex"]
nested = false

[gitignore]
enabled = true

[mcp_servers.codegraph]
type = "stdio"
command = "npx"
args = ["-y", "@colbymchenry/codegraph", "serve", "--mcp"]

[mcp_servers.context7]
type = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.playwright-neo]
type = "stdio"
command = "sh"
args = ["-c", "P=$(node -p \"try{require(require('os').homedir()+'/Library/Application Support/BrowserClaw/.browseros/config.json').ports.cdp||9110}catch(e){9110}\"); exec npx -y @playwright/mcp@latest --cdp-endpoint http://127.0.0.1:$P"]
